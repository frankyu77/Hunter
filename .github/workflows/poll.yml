name: Poll job sources

on:
  schedule:
    # Best-effort: 5 minutes is GitHub's minimum, and tight schedules get
    # delayed under load - expect roughly 5-15 minutes in practice. Free on
    # a public repo.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never let two polls run at once: an overlapping run would race the state
# commit. Queue the newer one instead of cancelling (never-miss rule).
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      dashboard: ${{ steps.site.outputs.built }}
    steps:
      # Check out the branch tip, not the commit that triggered the run. A run
      # queued behind another (concurrency above) would otherwise start from
      # state that the previous run has since replaced: it re-sends that run's
      # alerts and then fails to push its own stale seen_jobs.json.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll sources and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Encrypts the dashboard's private layer; unset = no private layer.
          HUNTER_PASSPHRASE: ${{ secrets.HUNTER_PASSPHRASE }}
        run: python -m scraper.main

      # The run writes site/ at most hourly (Pages rate-limits deploys).
      - name: Check for a dashboard build
        id: site
        run: echo "built=$([ -f site/index.html ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # continue-on-error: a Pages hiccup must never stop the state commit below.
      - name: Upload dashboard
        if: steps.site.outputs.built == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit updated state
        run: |
          if git diff --quiet seen_jobs.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs state"
          # A human may have pushed while we ran; rebase our state commit on top.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  # Publishes the dashboard. Needs Settings -> Pages -> Source: "GitHub Actions".
  # Kept out of the poll job so a Pages problem can never block state commits.
  deploy-dashboard:
    needs: poll
    if: needs.poll.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
