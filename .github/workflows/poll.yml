name: Poll job sources

on:
  schedule:
    # Best-effort: 5 minutes is GitHub's minimum, and tight schedules get
    # delayed under load - expect roughly 5-15 minutes in practice. Free on
    # a public repo.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  # A 👍/👎/✅ from the dashboard lands as a comment on the inbox issue
  # (scraper/inbox.py); this starts a run to apply it within a minute or two.
  # Cron would pick it up anyway - the comment stays until a run applies it.
  issue_comment:
    types: [created]

# Never let two polls run at once: an overlapping run would race the state
# commit. Queue the newer one instead of cancelling (never-miss rule).
concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    # Only the owner's comments on the inbox issue start a run; comments on
    # any other issue or PR are not ours.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.user.login == github.repository_owner &&
       contains(github.event.issue.labels.*.name, 'hunter-inbox'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write  # read, apply and delete dashboard actions in the inbox issue
    outputs:
      dashboard: ${{ steps.site.outputs.built }}
    steps:
      # Check out the branch tip, not the commit that triggered the run. A run
      # queued behind another (concurrency above) would otherwise start from
      # state that the previous run has since replaced: it re-sends that run's
      # alerts and then fails to push its own stale seen_jobs.json.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Wheels come from the cache on most runs, so a PyPI hiccup rarely
          # reaches the install at all.
          cache: pip

      # PyPI or the runner's network occasionally blips for a few seconds;
      # retry rather than fail the whole run (and email you) over it.
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            pip install -r requirements.txt && exit 0
            echo "pip install failed (attempt $attempt of 3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Poll sources and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Encrypts the dashboard's private layer; unset = no private layer.
          HUNTER_PASSPHRASE: ${{ secrets.HUNTER_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scraper.main

      # The run writes site/ at most hourly (Pages rate-limits deploys).
      - name: Check for a dashboard build
        id: site
        run: echo "built=$([ -f site/index.html ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # continue-on-error: a Pages hiccup must never stop the state commit below.
      - name: Upload dashboard
        if: steps.site.outputs.built == 'true'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit updated state
        run: |
          if git diff --quiet seen_jobs.json; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git commit -m "Update seen jobs state"
          # A human may have pushed while we ran; rebase our state commit on
          # top. Retried: a GitHub blip here would otherwise drop this run's
          # state, and the next run would redo (and may re-send) its work.
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "State push failed (attempt $attempt of 4); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          exit 1

  # Publishes the dashboard. Needs Settings -> Pages -> Source: "GitHub Actions".
  # Kept out of the poll job so a Pages problem can never block state commits.
  deploy-dashboard:
    needs: poll
    if: needs.poll.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
